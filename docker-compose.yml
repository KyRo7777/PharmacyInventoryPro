services:
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      SECRET_KEY: change-me
      DATABASE_URL: postgresql+psycopg://pharmacy:pharmacy@db:5432/pharmacy
      AI_ENABLED: "true"
      AI_PROVIDER: local
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    volumes: ["pharmacy_pgdata:/var/lib/postgresql/data"]
volumes:
  pharmacy_pgdata:
